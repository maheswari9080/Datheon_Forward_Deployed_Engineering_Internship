[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-intelligence-gateway"
version = "1.0.0"
description = "Enterprise Intelligence Gateway (EIG) - Secure Enterprise AI Integration Platform"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "Apache-2.0"}
authors = [
    {name = "Forward Deployed Engineering Team", email = "fde@datheon.ai"}
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "sqlalchemy>=2.0.30",
    "aiosqlite>=0.20.0",
    "pyjwt>=2.9.0",
    "chromadb>=0.5.0",
    "qdrant-client>=1.10.0",
    "rank-bm25>=0.2.2",
    "pypdf>=5.0.0",
    "httpx>=0.27.0",
    "prometheus-client>=0.20.0",
    "python-multipart>=0.0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.setuptools.packages.find]
where = ["src"]
